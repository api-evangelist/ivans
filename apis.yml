aid: ivans
name: IVANS
image: https://www.ivans.com/globalassets/all-images/ivans-press-release-1200x630.png
description: IVANS (Ivans Insurance Solutions) connects insurance carriers, MGAs and agencies with data exchange, download,
  distribution and market-access products. Its developer portal at api.ivans.com publishes REST API references for the Ivans
  Distribution Platform (FastIDP), Identification Network, IVANS Exchange (v1-v3), Translation, Download, Insights and Passport,
  with OAuth token-based authentication.
