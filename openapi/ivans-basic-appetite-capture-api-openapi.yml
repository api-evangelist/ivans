components:
  schemas:
    FieldValuesRequest:
      type: object
      properties:
        questionId:
          type: string
          minLength: 1
        value:
          type:
          - string
          - 'null'
      required:
      - questionId
      - value
    basic_appetite_capture_invalid_body_request:
      type: object
      properties:
        lobs:
          type: array
          items: {}
          default:
          - Required or Invalid
        markets:
          type: array
          items: {}
          default:
          - Required or Invalid
        fieldValues:
          type: array
          items: {}
          default:
          - Required or Invalid
    BasicAppetiteCaptureRequest:
      type: object
      description: 'Returns basic appetite result, form, and possible routes.


        Second serializer of the IDP appetite flow.


        Basic appetite result has status for each requested combination of markets, lobs, and states.


        Form contains:

        - basic appetite fields

        - enhanced appetite fields for risk profiles in appetite


        Possible routes contains possible route types for each requested combination of market and lob.


        ViewSet: BasicAppetiteCaptureViewSet


        Endpoint: /basic-appetite-capture/'
      properties:
        lobs:
          type: array
          items:
            type: string
        markets:
          type: array
          items:
            type: string
            format: uuid
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FieldValuesRequest'
      required:
      - fieldValues
      - lobs
      - markets
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/v1/token/
          refreshUrl: /api/v1/token/
          scopes:
            read: Read scope
            write: Write scope
            epic: Epic User
            third-party: Third Party User
    basicAuth:
      type: http
      scheme: basic
