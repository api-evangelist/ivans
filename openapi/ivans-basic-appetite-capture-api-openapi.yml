paths:
  /api/v1/basic-appetite-capture/:
    post:
      operationId: basic_appetite_capture_create
      description: 'Returns basic appetite result, form, and possible routes.


        Second endpoint of the IDP appetite flow.


        Basic appetite result has status for each requested combination of markets, lobs, and states.


        Form contains:

        - basic appetite fields

        - enhanced appetite fields for risk profiles in appetite

        - available risk profiles: list of risk profiles that passed basic appetite


        Possible routes contains possible route types for each requested combination of market and lob.'
      parameters:
      - in: query
        name: nested_form
        schema:
          type: boolean
        description: Format the returned form with nested pages, groups, and fields
      tags:
      - basic-appetite-capture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicAppetiteCaptureRequest'
            examples:
              StandardExample:
                value:
                  lobs:
                  - BOP
                  - WORK
                  markets:
                  - 7eeb51e5-6e68-4ca9-b85f-661f31a157b0
                  - c780e6d1-e89e-4a5d-8942-d43536e39092
                  fieldValues:
                  - questionId: f23c0847-1fce-4627-8744-b69bfdfa7b47
                    value: 24a5298c-9747-442b-8b3d-58587ee5fc08
                  - questionId: 3dcdd8fa-60f0-4352-b464-d444d91aa947
                    value: IL
                summary: Standard example
                description: The most common scenario is to use ACORD codes for lobs and UUIDs for markets. fieldValues is a list of dictionaries, in which questionId is the UUID of a form field and value is the answer to the field. For basic appetite, one field should be the NAICS index, and the other should be the primary state.
              UseUUIDsForLOBs:
                value:
                  lobs:
                  - 2bc95bf9-cf44-40fe-9d83-c7054bf4cc49
                  - 856f8ab3-761b-4899-b305-67a43ab92267
                  markets:
                  - 7eeb51e5-6e68-4ca9-b85f-661f31a157b0
                  - c780e6d1-e89e-4a5d-8942-d43536e39092
                  fieldValues:
                  - questionId: f23c0847-1fce-4627-8744-b69bfdfa7b47
                    value: 24a5298c-9747-442b-8b3d-58587ee5fc08
                  - questionId: 3dcdd8fa-60f0-4352-b464-d444d91aa947
                    value: IL
                summary: Use UUIDs for LOBs
                description: UUIDs can be used instead of codes for lobs
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BasicAppetiteCaptureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BasicAppetiteCaptureRequest'
        required: true
