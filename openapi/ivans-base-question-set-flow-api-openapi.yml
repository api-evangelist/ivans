openapi: 3.2.0
info:
  title: Ivans Distribution Platform Base Question Set Flow API
  description: APIs for serving carrier forms, appetite, and validation
  version: 0.1.0
tags:
- name: Base Question Set Flow
paths:
  /api/v1/forms/base-question-set:
    get:
      tags:
      - Base Question Set Flow
      summary: Get Base Question Set
      description: 'Returns Base Question Set for given LOB(s)

        Can optionally include Question Set for given Risk Profile(s)

        Nested form param will change the structure of form to the nested structure'
      operationId: get_base_question_set_api_v1_forms_base_question_set_get
      security:
      - HTTPBearer: []
      parameters:
      - name: lobs
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          title: Lobs
      - name: nested
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Nested
      - name: risk_profiles
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Risk Profiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Base Question Set Flow
      summary: Post Base Question Set
      description: 'Validates answers to Base Question Set


        Evaluates appetite for given Risk Profile(s) and returns combined Question Set for all valid Risk Profiles'
      operationId: post_base_question_set_api_v1_forms_base_question_set_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lobs
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          title: Lobs
      - name: nested
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Nested
      - name: risk_profiles
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          title: Risk Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotePayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
