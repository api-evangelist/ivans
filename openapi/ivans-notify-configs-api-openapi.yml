components:
  schemas:
    ConsumerInfo:
      required:
      - account
      - endpoint
      - headers
      - userId
      type: object
      properties:
        consumerInfoId:
          type: integer
          format: int32
        account:
          type: string
        userId:
          type: string
        delay:
          type: integer
          format: int32
        maxFileListSize:
          type: integer
          format: int32
        consumerPackage:
          type:
          - string
          - 'null'
        endpoint:
          type: string
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    ConsumerInfoRegistration:
      required:
      - account
      - delay
      - endpoint
      - maxFileListSize
      - userId
      type: object
      properties:
        account:
          minLength: 1
          type: string
          description: mailbox account to register notifications for
        userId:
          minLength: 1
          type: string
          description: mailbox userId to register notifications for
        consumerPackage:
          type:
          - string
          - 'null'
          description: custom data to send with notification
        delay:
          maximum: 2147483
          minimum: 0
          type: integer
          description: delay (in seconds) to wait between sending notifications for this registration
          format: int32
        maxFileListSize:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: maximum number of notifications to send
          format: int32
        endpoint:
          minLength: 1
          type: string
          description: endpoint to post notifications to
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
          description: custom headers to include in notification package
      additionalProperties: false
    ConsumerInfoUpdate:
      required:
      - delay
      - maxFileListSize
      type: object
      properties:
        consumerPackage:
          type:
          - string
          - 'null'
          description: custom data to send with notification
        delay:
          maximum: 2147483
          minimum: 0
          type: integer
          description: delay (in seconds) to wait between sending notifications for this registration
          format: int32
        maxFileListSize:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: maximum number of notifications to send
          format: int32
        headers:
          type:
