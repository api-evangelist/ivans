openapi: 3.2.0
info:
  title: IVANS Translation API's Claims Download API
  description: These API's expose endpoints to manage Download Transactions.
  license:
    name: Copyright (C) 2023 IVANS Insurance, All rights reserved
  version: '1.0'
servers:
- url: HTTPS://dev-cloud-dl.ivansinsurance.com
  description: Server URL in UAT environment
- url: HTTPS://cloud-dl.ivansinsurance.com
  description: Server URL in Production environment
tags:
- name: Claims Download API
paths:
  /ivans/api/carrier/claimsdownload:
    post:
      tags:
      - Claims Download API
      description: claims download operation
      operationId: processRequest_3
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimsDownloadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimsDownloadResponse'
      summary: Process request 3
      x-summary-source: derived
