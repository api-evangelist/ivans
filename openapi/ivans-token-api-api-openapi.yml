openapi: 3.2.0
info:
  title: IVANS Translation API's Token API
  description: These API's expose endpoints to manage Download Transactions.
  license:
    name: Copyright (C) 2023 IVANS Insurance, All rights reserved
  version: '1.0'
servers:
- url: HTTPS://dev-cloud-dl.ivansinsurance.com
  description: Server URL in UAT environment
- url: HTTPS://cloud-dl.ivansinsurance.com
  description: Server URL in Production environment
tags:
- name: Token API
paths:
  /ivans/api/carrier/tokens:
    post:
      tags:
      - Token API
      description: Obtain a token to be used with all download operations
      operationId: getAuthToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TokenRes'
      summary: Get auth token
      x-summary-source: derived
components:
  schemas:
    TokenRes:
      type: object
      properties:
        encryptionToken:
          type: string
        authToken:
          type: string
    TokenReq:
      type: object
      properties:
        carrierId:
          type: string
        password:
          type: string
      required:
      - carrierId
      - password
