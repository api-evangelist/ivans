  /api/v1/user/{user_id}/product-profiles/remove:
    patch:
      tags:
      - User Management
      summary: Remove User From Product Profiles
      operationId: remove_user_from_product_profiles_api_v1_user__user_id__product_profiles_remove_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserProductProfileRemove'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
