openapi: 3.2.0
info:
  title: Ivans Passport User Management API
  description: Middleware for Ivans Identity
  version: 0.1.0
servers:
- url: https://passport.ivans.com
  description: Production Server
- url: https://ivans-passport.us.staging.appliedcloudplatform.com/
  description: Staging Server
- url: https://ivans-passport.us.development.appliedcloudplatform.com/
  description: Development Server
tags:
- name: User Management
paths:
  /api/v1/user/sync-mfa:
    post:
      tags:
      - User Management
      summary: Sync Mfa Status
      operationId: sync_mfa_status_api_v1_user_sync_mfa_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/user/roles:
    get:
      tags:
      - User Management
      summary: Get Roles
      operationId: get_roles_api_v1_user_roles_get
      security:
      - HTTPBearer: []
      parameters:
      - name: role_types
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoleType'
          title: Role Types
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
                title: Response Get Roles Api V1 User Roles Get
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/self:
    get:
      tags:
      - User Management
      summary: Get Self
      operationId: get_self_api_v1_user_self_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - User Management
      summary: Update Self
      operationId: update_self_api_v1_user_self_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSelfUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/user/link-sso-identity:
    post:
      tags:
      - User Management
      summary: Link Sso Identity
      description: 'Flow B step 1: begin cross-email SSO account linking.

        The SSO token is validated via the Authorization header. Returns an Auth0 authorization URL

        that the UI should redirect the browser to so the user can authenticate their existing account.

        The SSO sub is signed into the OAuth state parameter — no cookie required.'
      operationId: link_sso_identity_api_v1_user_link_sso_identity_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkSSOInitiateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/user/link-sso-callback:
    get:
      tags:
      - User Management
      summary: Link Sso Callback
      description: 'Shared Flow B callback for both API and admin flows.

        Recovers the SSO sub (and optional redirect_to) from the signed state, exchanges the code,

        and links the two Auth0 identities. Returns JSON for API callers; redirects for admin callers.'
      operationId: link_sso_callback_api_v1_user_link_sso_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/create-from-sso:
    post:
      tags:
      - User Management
      summary: Create User From Sso
      description: 'Flow C: create a new Passport user from an SSO identity.

        Called when a user logs in via SSO and confirms they have no existing Passport account.'
      operationId: create_user_from_sso_api_v1_user_create_from_sso_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserFromSSORequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/self/product-profiles/:
    get:
      tags:
      - User Management
      summary: List Product Profiles For Self
      operationId: list_product_profiles_for_self_api_v1_user_self_product_profiles__get
      security:
      - HTTPBearer: []
      parameters:
      - name: is_admin_only
        in: query
        required: false
        schema:
          type: boolean
          description: If true, only return product profiles where the current user has "product_profiles_add_user" permission
          default: false
          title: Is Admin Only
        description: If true, only return product profiles where the current user has "product_profiles_add_user" permission
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProductProfileListItem_'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/{search_param}:
    get:
      tags:
      - User Management
      summary: Get User
      operationId: get_user_api_v1_user__search_param__get
      security:
      - HTTPBearer: []
      parameters:
      - name: search_param
        in: path
        required: true
        schema:
          type: string
          description: User ID, Email or External User ID
          title: Search Param
        description: User ID, Email or External User ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailWithProductProfiles'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/{search_param}/applications:
    put:
      tags:
      - User Management
      summary: Create Or Update Application Association
      description: 'Link a user to an application with an external user ID.

        If the user is already linked to that application, it will overwrite the external user ID if `overwrite` is set to True.'
      operationId: create_or_update_application_association_api_v1_user__search_param__applications_put
      security:
      - HTTPBearer: []
      parameters:
      - name: search_param
        in: path
        required: true
        schema:
          type: string
          description: User ID, Email or External User ID
          title: Search Param
        description: User ID, Email or External User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_create_or_update_application_association_api_v1_user__search_param__applications_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/:
    get:
      tags:
      - User Management
      summary: Get Users
      operationId: get_users_api_v1_user__get
      security:
      - HTTPBearer: []
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter users by email address
          title: Email
        description: Filter users by email address
      - name: blocked
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter users by blocked status
          title: Blocked
        description: Filter users by blocked status
      - name: has_mfa
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter users by MFA status
          title: Has Mfa
        description: Filter users by MFA status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TypeVar_Customized_TypeVar_Customized_UserDetail_'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - User Management
      summary: Create User
      operationId: create_user_api_v1_user__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user/{user_id}/product-profiles/add:
    patch:
      tags:
      - User Management
      summary: Add User To Product Profiles
      operationId: add_user_to_product_profiles_api_v1_user__user_id__product_profiles_add_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserProductProfileAdd'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailWithProductProfiles'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
