  /api/v1/user/{email}/product-profiles/add:
    put:
      tags:
      - User Management
      summary: Get Or Create User And Add User To Product Profiles
      description: User will be created if they do not already exist in the system
      operationId: get_or_create_user_and_add_user_to_product_profiles_api_v1_user__email__product_profiles_add_put
      security:
      - HTTPBearer: []
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
          title: Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserProductProfileAdd'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailWithProductProfiles'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Role:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        role_type:
          $ref: '#/components/schemas/RoleType'
      type: object
      required:
      - id
      - name
      - role_type
      title: Role
    UserProductProfileAdd:
      properties:
        product_profile_id:
          type: integer
          title: Product Profile Id
        role_id:
          type: integer
          title: Role Id
      type: object
      required:
      - product_profile_id
      - role_id
      title: UserProductProfileAdd
    UserDetailProduct:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: UserDetailProduct
    UserDetail:
      properties:
        id:
          type: integer
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        email:
          type: string
          title: Email
        email_verified:
          type: boolean
          title: Email Verified
        blocked:
          type: boolean
          title: Blocked
        has_mfa:
          type: boolean
          title: Has Mfa
        roles:
          items:
            $ref: '#/components/schemas/RoleWithPermissions'
          type: array
          title: Roles
        aliases:
          items:
            $ref: '#/components/schemas/UserApplication'
          type: array
          title: Aliases
        last_login:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Login
      type: object
      required:
      - id
      - created_at
      - updated_at
      - first_name
      - last_name
      - email
      - email_verified
      - blocked
      - has_mfa
      - roles
      - aliases
      - last_login
      title: UserDetail
    Alias:
      properties:
        application_name:
          type: string
          title: Application Name
          description: Name of the application the user is linked to
          examples:
          - EXCHANGE
        external_user_id:
          type: string
          title: External User Id
          description: External user ID in the linked application
      type: object
      required:
      - application_name
      - external_user_id
      title: Alias
      description: Schema for user application alias.
    Links:
      properties:
        first:
          anyOf:
          - type: string
          - type: 'null'
          title: First
          examples:
          - /api/v1/users?limit=1&offset1
        last:
          anyOf:
          - type: string
          - type: 'null'
          title: Last
          examples:
          - /api/v1/users?limit=1&offset1
        self:
          anyOf:
          - type: string
          - type: 'null'
          title: Self
          examples:
          - /api/v1/users?limit=1&offset1
        next:
          anyOf:
          - type: string
          - type: 'null'
