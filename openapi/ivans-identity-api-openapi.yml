paths:
  /api/v1/identity/auth0-reset-password/:
    post:
      tags:
      - Identity
      summary: Auth0 Reset Password
      operationId: auth0_reset_password_api_v1_identity_auth0_reset_password__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_auth0_reset_password_api_v1_identity_auth0_reset_password__post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/identity/auth0-token/:
    post:
      tags:
      - Identity
      summary: Auth0 Token
      operationId: auth0_token_api_v1_identity_auth0_token__post
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_auth0_token_api_v1_identity_auth0_token__post'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
              example:
                access_token: token
                refresh_token: token
                expires_in: 86400
                token_type: Bearer
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Not Found
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
          description: Failed Dependency
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: access_denied
                error_description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
