openapi: 3.2.0
info:
  title: Identification Network Enhanced Appetite API
  version: 1.0.0
  description: IVANS Identification Network API
servers:
- url: https://distribution-staging.ivansinsurance.com
tags:
- name: enhanced-appetite
paths:
  /api/v1/enhanced-appetite/:
    post:
      operationId: enhanced_appetite_create
      description: 'Returns enhanced appetite result and optional form.


        Enhanced appetite result has status for each requested combination of markets, lobs, and states.

        - If no markets are requested, appetite status is returned for all allowed markets.

        - If no states are requested, appetite status is returned for all US states.


        Optional form contains:

        - basic appetite fields

        - enhanced appetite fields for risk profiles in basic appetite

        - risk information fields for risk profiles in enhanced appetite

        - available risk profiles: list of risk profiles that passed basic and enhanced appetite,

        and that have the highest priority route for their respective product'
      parameters:
      - in: query
        name: nested_form
        schema:
          type: boolean
        description: Format the returned form with nested pages, groups, and fields
      - in: query
        name: return_form
        schema:
          type: boolean
        description: Return a form with risk information fields for markets in appetite
      tags:
      - enhanced-appetite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnhancedAppetiteRequest'
            examples:
              StandardExample:
                value:
                  lobs:
                  - BOP
                  - WORK
                  markets:
                  - 7eeb51e5-6e68-4ca9-b85f-661f31a157b0
                  - c780e6d1-e89e-4a5d-8942-d43536e39092
                  naicsIndex: e99fe5c4-01c8-433e-8e4a-d134a6a8a66e
                  states:
                  - AL
                  - AK
                  fieldValues:
                  - questionId: 800c6507-cbcb-45da-8339-d4a0d14da02f
                    value: 1
                  - questionId: d5f471a5-d93f-41e2-ad9e-9b3c8b015617
                    value: 10
                  - questionId: 134abdcd-011f-408c-8ea5-464fa8ae7e44
                    value: 500000
                  - questionId: e0c0b4cb-48a2-4f1e-bc75-20b6f4d81589
                    value: 1
                  - questionId: 57d1c3fe-4fe6-4778-b07b-57b9587d5fff
                    value: 'No'
                  - questionId: 7c93426f-33cb-4761-bada-7b5ea0eeb1bf
                    value: 500000
                  - questionId: d4794e2f-c883-4ab4-9dab-097968fe1bba
                    value: 500000
                summary: Standard example
                description: The most common scenario is to use ACORD codes for lobs, UUIDs for markets, UUID for naicsIndex, and ISO alpha-2 codes for states. fieldValues is a list of dictionaries, in which questionId is the UUID of a form field and value is the answer to the field. For enhanced appetite, these fields should pull from the eligibility questions returned in the basic appetite endpoint (if return_form was true).
