paths:
  /api/Files/{id}/Items/{index}:
    get:
      tags:
      - FileContents
      summary: Retrieve a list of metadata contents for a given file
      description: 'Retrieve metadata for the contents of the file specified by the id parameter,

        at the index specified by the index parameter. Indexes are one-based.

        This is a JSON-formatted object containing detailed information on a single data item in the file.'
      parameters:
      - name: id
        in: path
        description: The ID of the file to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: index
        in: path
        description: The index of the contents within the file to retrieve.
        required: true
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Returns data on success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileContent'
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
            text/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '204':
          description: Returns empty success
