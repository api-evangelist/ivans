openapi: 3.2.0
info:
  title: Identification Network Classification Standards API
  version: 1.0.0
  description: IVANS Identification Network API
servers:
- url: https://distribution-staging.ivansinsurance.com
tags:
- name: classification-standards
paths:
  /api/v1/classification-standards/:
    get:
      operationId: classification_standards_list
      description: Returns all the classification standards. Can filter by market and LOB
      parameters:
      - in: query
        name: lob
        schema:
          type: string
      - in: query
        name: market
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - classification-standards
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassificationStandardList'
          description: Successfully received the classification standards.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - tokenClass: AccessToken
                      tokenType: access
                      message: Token is invalid or expired
          description: Invalid or Expired token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/classification_standard_list_available_responses_pagination_fail'
          description: Invalid page.
      summary: Classification standards list
      x-summary-source: derived
  /api/v1/classification-standards/{external_id}/:
    get:
      operationId: classification_standards_retrieve
      description: Get an individual standard based on the external_id.
      parameters:
      - in: path
        name: external_id
        schema:
          type: string
        required: true
      tags:
      - classification-standards
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationStandardDetail'
          description: Returns individual classification standard and related codes.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - tokenClass: AccessToken
                      tokenType: access
                      message: Token is invalid or expired
          description: Invalid or Expired token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/classification_standard_detail_available_responses'
          description: '`externalId` does not have corresponding classification standard.'
      summary: Classification standards retrieve
      x-summary-source: derived
components:
  schemas:
    ClassificationStandard:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        externalId:
          type: string
          maxLength: 255
        market:
          type:
          - string
          - 'null'
        lineOfBusiness:
          type:
          - string
          - 'null'
      required:
      - externalId
      - lineOfBusiness
      - market
      - name
    ClassificationCode:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
        description:
          type: string
      required:
      - code
      - description
    classification_standard_detail_available_responses:
      type: object
      properties:
        details:
          type: string
          default: Not found.
    ClassificationStandardDetail:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        externalId:
          type: string
          maxLength: 255
        market:
          type:
          - string
          - 'null'
        lineOfBusiness:
          type:
          - string
          - 'null'
        classificationCodes:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationCode'
      required:
      - classificationCodes
      - externalId
      - lineOfBusiness
      - market
      - name
    PaginatedClassificationStandardList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: https://distribution.ivansinsurance.com/api/v1/classification-standards/?page=3
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: https://distribution.ivansinsurance.com/api/v1/classification-standards/?page=1
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationStandard'
    classification_standard_list_available_responses_pagination_fail:
      type: object
      properties:
        details:
          type: string
          default: Invalid page.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/v1/token/
          refreshUrl: /api/v1/token/
          scopes:
            read: Read scope
            write: Write scope
            epic: Epic User
            third-party: Third Party User
    basicAuth:
      type: http
      scheme: basic
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: searched
  source: https://api.ivans.com/reference/agencies_list
  generated: '2026-10-13'
  note: Assembled verbatim from the OpenAPI definition fragments IVANS embeds in each operation page of its ReadMe developer portal (api.ivans.com/reference); paths and components merged per API, nothing authored.
