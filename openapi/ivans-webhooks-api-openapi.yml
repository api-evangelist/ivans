openapi: 3.2.0
info:
  title: Ivans Passport Webhooks API
  description: Middleware for Ivans Identity
  version: 0.1.0
servers:
- url: https://passport.ivans.com
  description: Production Server
- url: https://ivans-passport.us.staging.appliedcloudplatform.com/
  description: Staging Server
- url: https://ivans-passport.us.development.appliedcloudplatform.com/
  description: Development Server
tags:
- name: Webhooks
paths:
  /api/v1/webhooks/auth0-user-events/:
    post:
      tags:
      - Webhooks
      summary: Handle User Event
      operationId: handle_user_event_api_v1_webhooks_auth0_user_events__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth0UserEvent'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Auth0UserEventObject:
      properties:
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        email:
          type: string
          title: Email
        email_verified:
          type: boolean
          title: Email Verified
        user_id:
          type: string
          title: User Id
        given_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Given Name
        family_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Family Name
        name:
          type: string
          title: Name
        blocked:
          type: boolean
          title: Blocked
          default: false
        multifactor:
          items:
            type: string
          type: array
          title: Multifactor
          default: []
      type: object
      required:
      - created_at
      - updated_at
      - email
      - email_verified
      - user_id
      - name
      title: Auth0UserEventObject
    Auth0UserEventType:
      type: string
      enum:
      - user.created
      - user.updated
      - user.deleted
      title: Auth0UserEventType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Auth0UserEvent:
      properties:
        type:
          $ref: '#/components/schemas/Auth0UserEventType'
        data:
          $ref: '#/components/schemas/Auth0UserEventData'
      type: object
      required:
      - type
      - data
      title: Auth0UserEvent
    _ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: _ErrorResponse
    Auth0UserEventData:
      properties:
        object:
          $ref: '#/components/schemas/Auth0UserEventObject'
      type: object
      required:
      - object
      title: Auth0UserEventData
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
