info:
  title: Ivans Distribution Platform FastPath Flow API
  description: APIs for serving carrier forms, appetite, and validation
  version: 0.1.0
tags:
- name: FastPath Flow
paths:
  /api/v1/forms/question-set/fast-path:
    get:
      tags:
      - FastPath Flow
      summary: Get Fast Path Question Set
      description: 'Returns a form with a single Risk Profile for the FastPath flow.


        Labels and visibility of fields are customized based on the supplied default field values template.

        Fields marked as `display_in_ui: hide` in the template are removed from the form.

        Fields with an `integrator_label` in the template will have their labels replaced.'
      operationId: get_fast_path_question_set_api_v1_forms_question_set_fast_path_get
      security:
      - HTTPBearer: []
      parameters:
      - name: nested
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Nested
      - name: template_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Template uuid
          title: Template Id
        description: Template uuid
      - name: risk_profile
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Risk Profile uuid
          title: Risk Profile
        description: Risk Profile uuid
      - name: naics_index
        in: query
        required: false
        schema:
          type: string
          description: NAICS code uuid
          title: Naics Index
        description: NAICS code uuid
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
            pattern: ^[A-Z]{2}$
          description: List of two letter state codes
          title: States
        description: List of two letter state codes
      responses:
        '200':
          description: Successful retrieval of FastPath question set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastPathFormResponse'
