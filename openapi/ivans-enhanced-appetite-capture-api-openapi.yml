                description: The most common scenario is to use ACORD codes for lobs and UUIDS for markets. fieldValues is a list of dictionaries, in which questionId is the UUID of a form field and value is the answer to the field. For enhanced appetite, these fields should pull from the basic appetite form as well as the eligibility questions returned in the basic appetite endpoint (if return_form was true).
