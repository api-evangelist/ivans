components:
  schemas:
    FieldValuesRequest:
      type: object
      properties:
        questionId:
          type: string
          minLength: 1
        value:
          type:
          - string
          - 'null'
      required:
      - questionId
      - value
    EnhancedAppetiteCaptureRequest:
      type: object
      description: 'Returns enhanced appetite result, form, and routes.


        Third serializer in IDP appetite flow.


        Enhanced appetite result has status for each requested combination of markets, lobs, and states.


        Form contains:

        - basic appetite fields

        - enhanced appetite fields for risk profiles in basic appetite

        - risk information fields for risk profiles in enhanced appetite


        Routes contains best available route type for each requested combination of market and lob.


        ViewSet: EnhancedAppetiteCaptureViewSet


        Endpoint: /enhanced-appetite-capture/'
      properties:
        lobs:
          type: array
          items:
            type: string
        markets:
          type: array
          items:
            type: string
            format: uuid
        fieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FieldValuesRequest'
      required:
      - fieldValues
      - lobs
      - markets
    en_appetite_capture_invalid_body_request:
      type: object
      properties:
        lobs:
          type: array
          items: {}
          default:
          - Required or Invalid
        markets:
          type: array
          items: {}
          default:
          - Required or Invalid
        fieldValues:
          type: array
          items: {}
          default:
          - Required or Invalid
  securitySchemes:
    cookieAuth:
