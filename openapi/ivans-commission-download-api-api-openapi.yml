openapi: 3.2.0
info:
  title: IVANS Translation API's Commission Download API
  description: These API's expose endpoints to manage Download Transactions.
  license:
    name: Copyright (C) 2023 IVANS Insurance, All rights reserved
  version: '1.0'
servers:
- url: HTTPS://dev-cloud-dl.ivansinsurance.com
  description: Server URL in UAT environment
- url: HTTPS://cloud-dl.ivansinsurance.com
  description: Server URL in Production environment
tags:
- name: Commission Download API
paths:
  /ivans/api/benefits/csv/upload:
    post:
      tags:
      - Commission Download API
      summary: Benefits Csv upload
      operationId: processBenefitsCsvRequest
      parameters:
      - name: ClientId
        in: header
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      - name: ErrorReturnType
        in: header
        required: false
        schema:
          type: string
          default: json
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: Successful Upload of csv file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvResponse'
        '202':
          description: Csv Upload Complete. FileId not available. Exchange delivery delayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvResponse202'
        '400':
          description: Invalid request received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvResponseJson'
        '401':
          description: Authorization Failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvResponse422'
        '503':
          description: CSV Conversion Service Not Available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvResponse503'
  /ivans/api/commissiondownload:
    post:
      tags:
      - Commission Download API
      description: Commission Download Operation
      operationId: processRequest
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionDownloadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommissionDownloadResponse'
      summary: Process request
      x-summary-source: derived
