    put:
      operationId: agencies_update
      description: 'Updates an agency if it is accessible to the user.


        Access restrictions:


        - Only service level and admin users can update an agency.

        - Service level users can update any agency under their integrated application.

        - Admin users can update their own agency.

        - Only service level users can set the test mode on an agency.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this tenant.
        required: true
      tags:
