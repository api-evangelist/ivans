components:
  schemas:
    ErrorFormat:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        traceId:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    AgencyResponse:
      required:
      - agencyAccount
      - agencyEmail
      - agencyName
      - agencyPhone
      - agencyPhoneExtension
      - alternateAgencyName
      - amsProductVersion
      - locationCity
      - locationState
      - locationStreet1
      - locationStreet2
      - locationZip
      - mailingCity
      - mailingState
      - mailingStreet1
      - mailingStreet2
      - mailingZip
      type: object
      properties:
        id:
          type: string
          format: uuid
        agencyAccount:
          type: string
        agencyName:
          type: string
        alternateAgencyName:
          type: string
        locationStreet1:
          type: string
        locationStreet2:
          type: string
        locationCity:
          type: string
        locationState:
          type: string
        locationZip:
          type: string
        mailingStreet1:
          type: string
        mailingStreet2:
          type: string
        mailingCity:
          type: string
        mailingState:
          type: string
        mailingZip:
          type: string
        agencyPhone:
          type: string
        agencyPhoneExtension:
          type: string
        agencyEmail:
          type: string
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        enableApiProfile:
          type: boolean
        amsProductVersionId:
          type: string
          format: uuid
        amsProductVersion:
          type: string
          format: uri; see <AmsVersionDetails>
        enableManualAmsInfoEdit:
          type: boolean
      additionalProperties: false
    agency_update:
      type: object
      properties:
        detail:
          type: string
          default: You do not have permission to perform this action.
    agency_list:
      type: object
      properties:
        detail:
          type: string
          default: You do not have permission to perform this action.
    agency_create:
      type: object
      properties:
        detail:
          type: string
          default: You do not have permission to perform this action.
    AgencyTenantWriteRequest:
      type: object
      description: Serializer for creating and updating agencies (tenants).
      properties:
        externalId:
          type: string
          minLength: 1
          description: The integrator's ID for the agency. Must be unique within the scope of the integrator.
          maxLength: 64
        npn:
          type: string
          description: The NPN of the agency.
          maxLength: 32
        name:
          type: string
          description: The name of the agency.
          maxLength: 128
        isActive:
          type: boolean
          description: Whether the agency is active.
        testMode:
          type: boolean
          description: Whether the agency is in test mode. In test mode, submissions for this agency will not be sent to the carrier, and a placeholder quote will be returned instead.
      required:
      - externalId
      - isActive
      - name
      - npn
    agency_retrieve:
      type: object
      properties:
        detail:
          type: string
          default: You do not have permission to perform this action.
  securitySchemes:
    Bearer:
      type: http
      description: JWT
      scheme: Bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /api/v1/token/
          refreshUrl: /api/v1/token/
          scopes:
            read: Read scope
            write: Write scope
            epic: Epic User
            third-party: Third Party User
    basicAuth:
