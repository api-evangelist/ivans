openapi: 3.2.0
info:
  title: Ivans Agencies API
  version: '1.0'
  description: 'Operations tagged Agencies across 2 of this provider''s published API definitions: ivans-exchange-v1-openapi.json, ivans-identification-network-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://distribution-staging.ivansinsurance.com
tags:
- name: Agencies
paths:
  /api/Agencies:
    get:
      tags:
      - Agencies
      summary: Gets list of agencies in the IVANS system
      parameters:
      - name: account
        in: query
        description: agency y-account to search for
        schema:
          type: string
          description: agency y-account to search for
      - name: agencyUserId
        in: query
        description: agency userid to search for
        schema:
          type: string
          description: agency userid to search for
      - name: name
        in: query
        description: agency name to search for
        schema:
          type: string
          description: agency name to search for
      - name: city
        in: query
        description: agency city to search for
        schema:
          type: string
          description: agency city to search for
      - name: state
        in: query
        description: agency state to search for
        schema:
          type: string
          description: agency state to search for
      - name: zip
        in: query
        description: agency zipcode to search for
        schema:
          type: string
          description: agency zipcode to search for
      - name: phone
        in: query
        description: agency phone number to search for
        schema:
          type: string
          description: agency phone number to search for
      - name: exact
        in: query
        description: when set to "true", does an exact search on the parameters requested
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: page to fetch
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: size of page to fetch
        schema:
          type: integer
          format: int32
          default: 25
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Returns data on success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponse'
        '400':
          description: Error if request could not be completed with given input
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorFormat'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFormat'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorFormat'
        '403':
          description: Error if requested resource was not permissible for user
      security:
      - Bearer: []
      operationId: getApiAgencies
      x-operation-id-source: derived
  /api/v1/agencies/:
    post:
      operationId: agencies_create
      description: 'Creates a new agency.


        Access restrictions:


        - Only service level users can use this endpoint to register an agency.

        - Only service level users can set the test mode on an agency.

        - Non-service level users must use the PUT endpoint instead to register an agency.'
      tags:
      - Agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgencyTenantWriteRequest'
        required: true
      security:
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DefaultResponse:
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    externalId: string
                    npn: string
                    name: string
                    isActive: true
                    testMode: false
                  summary: Default response
          description: Successfully created an agency
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotAuthorizedForIntegratedApplication:
                  value:
                    detail: User is not authorized for the given integrated application.
                  summary: Not authorized for integrated application
                Non-serviceLevelUserCannotPOST:
                  value:
                    detail: Tenant data already exists for your integrated application. Use the PUT endpoint to register agency information on existing tenants.
                  summary: Non-service level user cannot POST
                DuplicateExternalID:
                  value:
                    externalId: Agency with this external ID already exists.
                  summary: Duplicate external ID
          description: Creation errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - tokenClass: AccessToken
                      tokenType: access
                      message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agency_create'
          description: Creation errored due to lack of permission
      summary: Agencies create
      x-summary-source: derived
    get:
      operationId: agencies_list
      description: 'Returns agencies that are accessible to the user.


        Access restrictions:


        - Service level users can retrieve any agency, agent, and license under their integrated application.

        - Admin users can retrieve their own agency, and any agent or license under their agency.

        - Non-admin users can retrieve their own active agency, their own active agent, and active licenses where

        they or their agency are the licensee, or where they are granted access.'
      parameters:
      - in: query
        name: external_id
        schema:
          type: string
        description: Filter by agency external ID (exact match)
      - in: query
        name: include_agent_info
        schema:
          type: boolean
          default: false
        description: Include agent information in the response
      - in: query
        name: include_license_info
        schema:
          type: boolean
          default: false
        description: Include license information in the response
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by agency's active status
      - in: query
        name: npn
        schema:
          type: string
        description: Filter by agency NPN (exact match)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: test_mode
        schema:
          type: boolean
        description: Filter by agency's test mode status
      tags:
      - Agencies
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DoNotIncludeAgentAndLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      externalId: string
                      npn: string
                      name: string
                      isActive: true
                      testMode: false
                  summary: Do not include agent and license info
                IncludeAgentInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      externalId: string
                      npn: string
                      name: string
                      isActive: true
                      testMode: false
                      agents:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        npn: string
                        firstName: string
                        middleName: string
                        lastName: string
                        email: user@example.com
                        isActive: true
                        isAdmin: true
                        isProducer: true
                  summary: Include agent info
                IncludeLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      externalId: string
                      npn: string
                      name: string
                      isActive: true
                      testMode: false
                      licenses:
                      - uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        licenseNumber: string
                        type: string
                        subdivision: string
                        licenseStatus: string
                        residentStatus: string
                        expirationDate: YYYY-MM-DD
                        agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agencyLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agentLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agentsGrantedAccess:
                        - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  summary: Include license info
                IncludeAgentAndLicenseInfo:
                  value:
                    count: 1
                    next: path/to/next/page
                    previous: path/to/previous/page
                    results:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      externalId: string
                      npn: string
                      name: string
                      isActive: true
                      testMode: false
                      agents:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        externalId: string
                        agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        npn: string
                        firstName: string
                        middleName: string
                        lastName: string
                        email: user@example.com
                        isActive: true
                        isAdmin: true
                        isProducer: true
                      licenses:
                      - uuid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        licenseNumber: string
                        type: string
                        subdivision: string
                        licenseStatus: string
                        residentStatus: string
                        expirationDate: YYYY-MM-DD
                        agency: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agencyLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agentLicensee: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        agentsGrantedAccess:
                        - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  summary: Include agent and license info
          description: Successfully retrieved agencies
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                NotAuthorizedForIntegratedApplication:
                  value:
                    detail: User is not authorized for the given integrated application.
                  summary: Not authorized for integrated application
          description: Retrieval errored due to bad request
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Invalid:
                  value:
                    details: Authentication credentials were not provided.
                Expired:
                  value:
                    detail: Given token not valid for any token type
                    code: token_not_valid
                    messages:
                    - tokenClass: AccessToken
                      tokenType: access
                      message: Token is invalid or expired
          description: Invalid or Expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agency_list'
          description: Retrieval errored due to lack of permission
      summary: Agencies list
      x-summary-source: derived
    servers:
    - url: https://distribution-staging.ivansinsurance.com
