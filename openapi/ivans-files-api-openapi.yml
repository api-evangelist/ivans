openapi: 3.2.0
info:
  title: Ivans Files API
  version: '1.0'
  description: 'Operations tagged Files across 3 of this provider''s published API definitions: ivans-exchange-v1-openapi.json, ivans-exchange-v2-openapi.json, ivans-exchange-v3-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Files
paths:
  /api/Files/{id}/history:
    get:
      tags:
      - Files
      summary: Retrieve the history of a given file
      description: Get the history of a file using the fileId.
      parameters:
      - name: id
        in: path
        description: The ID of the file to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileHistoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/FileHistoryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/FileHistoryResponse'
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '404':
          description: File ID was not found.
      security:
      - Bearer: []
      operationId: getApiFilesByIdHistory
      x-operation-id-source: derived
  /api/Files/{id}/metadata:
    get:
      tags:
      - Files
      summary: Retrieve the metadata of a given file
      description: Retrieves a file's meta data by utilizing the fileId.
      parameters:
      - name: id
        in: path
        description: The ID of the file to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FileMetadata'
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
            text/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '401':
          description: User not authorized to view this resource.
        '404':
          description: File ID was not found.
      security:
      - Bearer: []
      operationId: getApiFilesByIdMetadata
      x-operation-id-source: derived
  /api/Files/{id}:
    get:
      tags:
      - Files
      summary: Retrieve a given file
      description: Download a file sent to you using the fileId.
      parameters:
      - name: id
        in: path
        description: The ID of the file to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: decompressFile
        in: query
        description: When true file is returned uncompressed if in ZIP or COMMPRESS format, otherwise it will be returned as is
        schema:
          type: boolean
          default: false
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '404':
          description: File ID was not found.
      security:
      - Bearer: []
      operationId: getApiFilesById
      x-operation-id-source: derived
  /api/Files:
    get:
      tags:
      - Files
      summary: Retrieve a list of all files that match the query string
      description: Retrieve a list of all files that match the query string? criteria provided in the URI using an account-mailboxId pairing. This is a JSON-formatted collection with each object containing detailed information on a single file. Additional parameters may be provided to limit the number of files in the returned collection or filter by class code. This endpoint accepts headers used to identify the recipients Agency Management System, Operating System, and optional information unique to this recipient.
      parameters:
      - name: account
        in: query
        description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
        schema:
          type: string
          default: ''
      - name: userId
        in: query
        description: The ID of the user.
        schema:
          type: string
          default: ''
      - name: classcode
        in: query
        description: 'The classcode single value can be as: AIDOWN, AIUP, etc. Used as an optional filter.'
        schema:
          type: string
      - name: statuscode
        in: query
        description: The type of files received. May be either 'inbox' or 'received'. Defaults to 'inbox' if not used.
        schema:
          type: string
          default: inbox
      - name: page
        in: query
        description: The page. Defaults to 0 if statuscode = 'inbox' or 1 if statuscode = 'received'.
        schema:
          type: integer
          format: int32
          default: 0
      - name: pagesize
        in: query
        description: The page size. Defaults to 25. Only used if page > 0.
        schema:
          type: integer
          format: int32
          default: 25
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-IVANS-Vendor-Company
        in: header
        description: Creator of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Product
        in: header
        description: Name of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Version
        in: header
        description: Agency management system version
        schema:
          type: string
      - name: X-IVANS-Vendor-Customer-Data
        in: header
        description: Caller specific data
        schema:
          type: string
      - name: X-IVANS-Client-Operating-System
        in: header
        description: Caller operating system
        schema:
          type: string
      - name: X-IVANS-Client-Instance-Id
        in: header
        description: 'Guid representing caller. (Note: this GUID must be associated only with this caller and must be the same each time this call is made; it may never change once assigned)'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Successful operation. NOTE: for pagination, it is recommended to use V2 as V1 pagination does not work as expected'
          headers:
            First:
              description: Pagination First Page URL
              schema:
                type: string
                format: uri
            Next:
              description: Pagination Next Page URL
              schema:
                type: string
                format: uri
            Prev:
              description: Pagination Previous Page URL
              schema:
                type: string
                format: uri
            Last:
              description: Pagination Last Page URL
              schema:
                type: string
                format: uri
            Record-Count:
              description: Total Record Count
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithStatus'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithStatus'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithStatus'
        '204':
          description: No files were found for the given parameters.
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
      security:
      - Bearer: []
      operationId: getApiFiles
      x-operation-id-source: derived
    post:
      tags:
      - Files
      summary: Send a file to one of your trading partners
      description: 'Send a file to a recipient that is one of your trading partners. There is a required header and an optional header with this request: the required header is for file metadata which includes the trading partner the file is being sent to; the optional header is an MD5 hash that is used to verify file integrity on the server.'
      parameters:
      - name: type
        in: query
        description: File type being sent. Currently, only media is supported.
        schema:
          type: string
      - name: api-version
        in: query
        schema:
          type: string
      - name: X-IVANS-File-Metadata
        in: header
        description: Routing and metadata for a file being sent.  Send and receive mailboxes must be associated via a trading partnership.
        schema:
          $ref: '#/components/schemas/FileRequest'
      - name: X-IVANS-File-Hash
        in: header
        description: (Optional) MD5 file hash for file being sent.
        schema:
          type: string
      - name: X-IVANS-Client
        in: header
        description: (Optional) The client name that will be used in identifying file transfer sessions with the Exchange API.
        schema:
          type: string
      responses:
        '202':
          description: Successful operation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PostFilesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PostFilesResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PostFilesResponse'
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '503':
          description: Invalid media type.
      security:
      - Bearer: []
      operationId: postApiFiles
      x-operation-id-source: derived
  /api/Files/{id}/Received:
    put:
      tags:
      - Files
      summary: Update the status of a given file to RECEIVED
      description: Set the status of a file to RECEIVED using the fileId. The retrieved file then moves from the recipient's Inbox to Received and from the sender's Outbox to Sent. Execute this call only after the file has been downloaded and its integrity confirmed.
      parameters:
      - name: id
        in: path
        description: The ECS file id for the file that the caller received successfully.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '204':
          description: This file's status is already received
        '400':
          description: System cannot mark this file as received.
        '401':
          description: User not authorized to view this resource.
        '404':
          description: The file id or associated mailbox is not available on the system.
      security:
      - Bearer: []
      operationId: putApiFilesByIdReceived
      x-operation-id-source: derived
  /api/Files/{id}/status:
    put:
      tags:
      - Files
      summary: Update the status of a given file
      description: Change the status of a file to the specified status.
      parameters:
      - name: id
        in: path
        description: The id of the file.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        schema:
          type: string
      requestBody:
        description: 'The new status for the file specified by file id. Valid file statuses include ''H'' for Hold, ''S'' for Send, ''C'' for Cancel, ''R'' for Receive, and ''V'' for Available

          Hold: Used on a file with status ''Send'' (S).

          Send: Used on a file with status ''Hold'' (H), ''Auto-Acknowledged'' (T), or ''Cancel'' (C).

          Receive: Used on a file with status ''Send'' (S).

          Cancel: Used on a file with status ''Send'' (S) or ''Hold'' (H).

          Available: Used on a file with the status ''Send'' (S) or ''Cancel'' (C)'
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/FileStatus'
          application/json:
            schema:
              $ref: '#/components/schemas/FileStatus'
          text/json:
            schema:
              $ref: '#/components/schemas/FileStatus'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FileStatus'
      responses:
        '200':
          description: Successful operation.
        '400':
          description: Could not change the file status to the specified status. Status may be invalid.
        '401':
          description: User not authorized to view this resource.
        '404':
          description: The file with the specified id was not found.
      security:
      - Bearer: []
      operationId: putApiFilesByIdStatus
      x-operation-id-source: derived
  /api/v2/Files/{id}:
    get:
      tags:
      - Files
      summary: Retrieve a given file
      description: Download a file sent to you using the fileId.
      parameters:
      - name: id
        in: path
        description: The ID of the file to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: decompressFile
        in: query
        description: When true file is returned uncompressed if in ZIP or COMMPRESS format, otherwise it will be returned as is
        schema:
          type: boolean
          default: false
      - name: Accept
        in: header
        description: Tells the translation service which format to translate to.
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '403':
          description: 'Forbidden - Requires the following scope: file_transfer'
          headers:
            WWW-Authenticate:
              description: Bearer error="insufficient_scope"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: insufficient_scope
        '404':
          description: File ID was not found.
        '406':
          description: There is an issue with the data provided.
        '409':
          description: Cannot decompress corrupt or incomplete file. Remove [decompressFile] parameter to download original file.
      security:
      - {}
      x-required-scopes:
      - file_transfer
      operationId: getApiV2FilesById
      x-operation-id-source: derived
  /api/v2/Files:
    get:
      tags:
      - Files
      summary: Retrieve a list of all files that match the query string
      description: Retrieve a paginated list of all files that match the query string? criteria provided in the URI using an account-mailboxId pairing. This is a JSON-formatted collection with each object containing detailed information on a single file. Class code may be provided to filter by class code. This endpoint accepts headers used to identify the recipient's Agency Management System, Operating System, and optional information unique to this recipient. Files are retrieved on a page by page basis determined by page and pageSize.
      parameters:
      - name: account
        in: query
        description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
        schema:
          type: string
          default: ''
      - name: userId
        in: query
        description: The ID of the user.
        schema:
          type: string
          default: ''
      - name: classcode
        in: query
        description: 'The classcode single value can be as: AIDOWN, AIUP, etc. Used as an optional filter.'
        schema:
          type: string
          default: ''
      - name: statuscode
        in: query
        description: The type of files received. May be either 'inbox' or 'received'. Defaults to 'inbox' if not used.
        schema:
          type: string
          default: inbox
      - name: page
        in: query
        description: The page being requested. If page is not provided, the default is 1.
        schema:
          type: integer
          format: int32
          default: 1
      - name: pagesize
        in: query
        description: The page size, with a lower limit of 25 and an upper limit of 500. If pageSize isn't provided, the default is 25.
        schema:
          type: integer
          format: int32
          default: 25
      - name: X-IVANS-Vendor-Company
        in: header
        description: Creator of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Product
        in: header
        description: Name of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Version
        in: header
        description: Agency management system version
        schema:
          type: string
      - name: X-IVANS-Vendor-Customer-Data
        in: header
        description: Caller specific data
        schema:
          type: string
      - name: X-IVANS-Client-Operating-System
        in: header
        description: Caller operating system
        schema:
          type: string
      - name: X-IVANS-Client-Instance-Id
        in: header
        description: 'Guid representing caller. (Note: this GUID must be associated only with this caller and must be the same each time this call is made; it may never change once assigned)'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          headers:
            First:
              description: Pagination First Page URL
              schema:
                type: string
                format: uri
            Next:
              description: Pagination Next Page URL
              schema:
                type: string
                format: uri
            Prev:
              description: Pagination Previous Page URL
              schema:
                type: string
                format: uri
            Last:
              description: Pagination Last Page URL
              schema:
                type: string
                format: uri
            Record-Count:
              description: Total Record Count
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithContentTypeAndStatus'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithContentTypeAndStatus'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileWithContentTypeAndStatus'
        '204':
          description: No files were found for the given parameters.
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '403':
          description: 'Forbidden - Requires the following scope: file_transfer'
          headers:
            WWW-Authenticate:
              description: Bearer error="insufficient_scope"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: insufficient_scope
      security:
      - {}
      x-required-scopes:
      - file_transfer
      operationId: getApiV2Files
      x-operation-id-source: derived
  /api/v3/Files/FileCount:
    get:
      tags:
      - Files
      summary: Retrieve a count of all files that match the query string
      description: Retrieve a count of all files that match the query string criteria provided in the URI using an account-mailboxId pairing. Class code may be provided to filter by class code. This endpoint accepts headers used to identify the recipient's Agency Management System, Operating System, and optional information unique to this recipient.
      parameters:
      - name: account
        in: query
        description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
        schema:
          type: string
          description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
      - name: userId
        in: query
        description: The ID of the user.
        schema:
          type: string
          description: The ID of the user.
      - name: filterAccount
        in: query
        description: The inverse coupling of account and direction. If direction is Inbound this will filter on Outbound accounts and vice versa. Used as an optional filter. Accepts multiple values.
        schema:
          type: array
          items:
            type: string
          description: The inverse coupling of account and direction. If direction is Inbound this will filter on Outbound accounts and vice versa. Used as an optional filter. Accepts multiple values.
      - name: filterUserId
        in: query
        description: The inverse coupling of userId and direction. If direction is Inbound this will filter on Outbound userIds and vice versa. Used as an optional filter. Accepts multiple values.
        schema:
          type: array
          items:
            type: string
          description: The inverse coupling of userId and direction. If direction is Inbound this will filter on Outbound userIds and vice versa. Used as an optional filter. Accepts multiple values.
      - name: classCode
        in: query
        description: 'The classCode. Used as an optional filter. Accepts multiple values. Valid values include: ALRTDWN, AIDOWN, AIUP, etc.'
        schema:
          type: array
          items:
            type: string
          description: 'The classCode. Used as an optional filter. Accepts multiple values. Valid values include: ALRTDWN, AIDOWN, AIUP, etc.'
      - name: contentType
        in: query
        description: 'The type of file. Valid values include: BDBCD, Claim, DBCD, eDoc, Mixed, Policy, and Unknown. Optional filter. Accepts multiple values.'
        schema:
          type: array
          items:
            type: string
          description: 'The type of file. Valid values include: BDBCD, Claim, DBCD, eDoc, Mixed, Policy, and Unknown. Optional filter. Accepts multiple values.'
      - name: statusCode
        in: query
        description: 'The fileStatus. Used as an optional filter. Accepts multiple values. Valid values include: Acknowledged, Auto-Acknowledged, Available, Canceled, Hold, Incomplete, Purged, Received.'
        schema:
          type: array
          items:
            type: string
          description: 'The fileStatus. Used as an optional filter. Accepts multiple values. Valid values include: Acknowledged, Auto-Acknowledged, Available, Canceled, Hold, Incomplete, Purged, Received.'
      - name: startDate
        in: query
        description: The start date. Used as an optional filter.
        schema:
          type: string
          description: The start date. Used as an optional filter.
          format: date-time
      - name: stopDate
        in: query
        description: The stop date. Used as an optional filter.
        schema:
          type: string
          description: The stop date. Used as an optional filter.
          format: date-time
      - name: dateType
        in: query
        description: The date type to filter by. Used as an optional filter. Valid options are 'send' and 'received'. If dateType is not provided, the default is 'send'.
        schema:
          type: string
          description: The date type to filter by. Used as an optional filter. Valid options are 'send' and 'received'. If dateType is not provided, the default is 'send'.
      - name: direction
        in: query
        description: The direction of file send relative to the account and userId. Used as an optional filter. Valid options are 'inbound', 'outbound' and 'inNout'. If direction is not provided, the default is both 'inNout'.
        schema:
          type: string
          description: The direction of file send relative to the account and userId. Used as an optional filter. Valid options are 'inbound', 'outbound' and 'inNout'. If direction is not provided, the default is both 'inNout'.
      - name: filterPolicyNumber
        in: query
        description: Used as an optional filter.  This must be an exact match.
        schema:
          type: string
          description: Used as an optional filter.  This must be an exact match.
      - name: filterAgencyCode
        in: query
        description: Used as an optional filter.  This must be an exact match.
        schema:
          type: string
          description: Used as an optional filter.  This must be an exact match.
      - name: allMailboxes
        in: query
        description: a flag to dictate whether or not to search all mailboxes; if false, then both account and userId are required
        schema:
          type: boolean
          description: a flag to dictate whether or not to search all mailboxes; if false, then both account and userId are required
      - name: page
        in: query
        description: The page being requested. If page is not provided, the default is 1.
        schema:
          type: integer
          description: The page being requested. If page is not provided, the default is 1.
          format: int32
      - name: pageSize
        in: query
        description: The page size, with a lower limit of 25 and an upper limit of 500. If pageSize isn't provided, the default is 25.
        schema:
          type: integer
          description: The page size, with a lower limit of 25 and an upper limit of 500. If pageSize isn't provided, the default is 25.
          format: int32
      - name: exportCSV
        in: query
        description: Export files to CSV.
        schema:
          type: boolean
          description: Export files to CSV.
      - name: X-IVANS-Vendor-Company
        in: header
        description: Creator of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Product
        in: header
        description: Name of agency management system
        schema:
          type: string
      - name: X-IVANS-Vendor-Version
        in: header
        description: Agency management system version
        schema:
          type: string
      - name: X-IVANS-Vendor-Customer-Data
        in: header
        description: Caller specific data
        schema:
          type: string
      - name: X-IVANS-Client-Operating-System
        in: header
        description: Caller operating system
        schema:
          type: string
      - name: X-IVANS-Client-Instance-Id
        in: header
        description: 'Guid representing caller. (Note: this GUID must be associated only with this caller and must be the same each time this call is made; it may never change once assigned)'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RecordCountResult'
            application/json:
              schema:
                $ref: '#/components/schemas/RecordCountResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RecordCountResult'
        '204':
          description: No files were found for the given parameters.
        '400':
          description: The request is not formatted properly.
        '401':
          description: User not authorized to view this resource.
        '500':
          description: Looks like we encountered an error. Please try again a little bit later.
      security:
      - Bearer: []
      operationId: getApiV3FilesFileCount
      x-operation-id-source: derived
  /api/v3/Files:
    get:
      tags:
      - Files
      summary: Retrieve a list of all files that match the query string
      description: Retrieve a paginated list of all files that match the query string criteria provided in the URI using an account-mailboxId pairing. This is a JSON-formatted collection with each object containing detailed information on a single file. Class code may be provided to filter by class code. This endpoint accepts headers used to identify the recipient's Agency Management System, Operating System, and optional information unique to this recipient. Files are retrieved on a page by page basis determined by page and pageSize.
      parameters:
      - name: account
        in: query
        description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
        schema:
          type: string
          description: The organization account code of Agency or Carrier. Starting from 'Y...' for agency.
      - name: userId
        in: query
        description: The ID of the user.
        schema:
          type: string
          description: The ID of the user.
      - name: filterAccount
        in: query
        description: The inverse coupling of account and direction. If direction is Inbound this will filter on Outbound accounts and vice versa. Used as an optional filter. Accepts multiple values.
        schema:
          type: array
          items:
            type: string
          description: The inverse coupling of account and direction. If direction is Inbound this will filter on Outbound accounts and vice versa. Used as an optional filter. Accepts multiple values.
      - name: filterUserId
        in: query
        description: The inverse coupling of userId and direction. If direction is Inbound this will filter on Outbound userIds and vice versa. Used as an optional filter. Accepts multiple values.
        schema:
          type: array
