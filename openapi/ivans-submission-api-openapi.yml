      - HTTPBearer: []
      parameters:
      - name: test_submission
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Test Submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequestPayload'
      responses:
        '200':
          description: Successful Submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                All Risk Profiles have validation errors or are not in appetite:
                  value:
