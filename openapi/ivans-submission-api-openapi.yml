components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ErrorMsg:
      properties:
        detail:
          type: string
          title: Detail
        condition(s):
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Condition(S)
      type: object
      required:
      - detail
      title: ErrorMsg
    WarningDetail:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: WarningDetail
    RepeatableFieldBlock:
      properties:
        id:
          type: string
          title: Id
        fieldBlockId:
          type: string
          title: Fieldblockid
        parentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentid
        fieldValues:
          items:
            $ref: '#/components/schemas/FieldValue'
          type: array
          title: Fieldvalues
      type: object
      required:
      - id
      - fieldBlockId
      - fieldValues
      title: RepeatableFieldBlock
      description: 'id: row id (i.e., building #2)

        field_block_id: guid of the form group (IDNET repeatable group, i.e., building group)

        parent_id: guid of specific parent field block (i.e., location #3)'
    SubmissionRequestPayload:
      properties:
        metadata:
          $ref: '#/components/schemas/SubmissionMetadata'
        marketMetadata:
          items:
            $ref: '#/components/schemas/SubmissionMarketMetadata'
          type: array
          title: Marketmetadata
        fieldValues:
          items:
            $ref: '#/components/schemas/FieldValue'
          type: array
          title: Fieldvalues
        repeatableFieldBlocks:
          items:
            $ref: '#/components/schemas/RepeatableFieldBlock'
          type: array
          title: Repeatablefieldblocks
      type: object
      required:
      - metadata
      - marketMetadata
      title: SubmissionRequestPayload
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FastPathSubmissionRequestPayload:
      properties:
        metadata:
          $ref: '#/components/schemas/SubmissionMetadata'
        marketMetadata:
          items:
            $ref: '#/components/schemas/SubmissionMarketMetadata'
          type: array
          maxItems: 1
          title: Marketmetadata
        fieldValues:
          items:
            $ref: '#/components/schemas/FieldValue'
          type: array
          title: Fieldvalues
        repeatableFieldBlocks:
          items:
            $ref: '#/components/schemas/RepeatableFieldBlock'
          type: array
          title: Repeatablefieldblocks
        templateIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Templateids
          description: Templates will be applied in the order they are submitted, if no template ids are provided, the Ivans default template will be used
          examples:
          - - d5b72035-f8e9-47c5-8591-adec34232401
            - 4a99c8df-39a5-4126-89d1-95b576cc1318
      type: object
      required:
      - metadata
      - marketMetadata
      title: FastPathSubmissionRequestPayload
    SubmissionTransaction:
      properties:
        riskProfileUuid:
          type: string
          title: Riskprofileuuid
        marketUuid:
          type: string
          title: Marketuuid
        name:
          type: string
          title: Name
        lineOfBusiness:
          type: string
          title: Lineofbusiness
        timeout:
          type: integer
          title: Timeout
          default: 60
        submissionErrorMsg:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Submissionerrormsg
      type: object
      required:
      - riskProfileUuid
      - marketUuid
      - name
      - lineOfBusiness
      title: SubmissionTransaction
    EvaluationType:
      type: string
      enum:
      - Market
      - IDP Quote
      - IDP Bind
      title: EvaluationType
    Evaluation:
      properties:
        type:
          $ref: '#/components/schemas/EvaluationType'
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          type: array
          title: Reasons
      type: object
      required:
      - type
      - reasons
      title: Evaluation
    RiskProfile:
      properties:
        uuid:
          type: string
          title: Uuid
        name:
          type: string
          title: Name
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        market:
          anyOf:
          - type: string
          - type: 'null'
          title: Market
        marketUuid:
          anyOf:
          - type: string
          - type: 'null'
          title: Marketuuid
        excessAndSurplus:
          type: boolean
          title: Excessandsurplus
          default: false
        lob:
          anyOf:
          - type: string
          - type: 'null'
          title: Lob
        childLobs:
          anyOf:
          - type: string
          - type: 'null'
          title: Childlobs
        inAppetite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Inappetite
          default: true
        bindAllowed:
          type: boolean
          title: Bindallowed
        bindAppetite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Bindappetite
        referAllowed:
          type: boolean
          title: Referallowed
        routeType:
          anyOf:
          - type: string
          - type: 'null'
          title: Routetype
        requiredToSubmit:
          anyOf:
          - $ref: '#/components/schemas/RequiredToSubmit'
          - additionalProperties: true
            type: object
          title: Requiredtosubmit
        validationErrors:
          items:
            $ref: '#/components/schemas/IDPValidationError'
          type: array
          title: Validationerrors
        validationWarnings:
          items:
            $ref: '#/components/schemas/IDPValidationWarning'
          type: array
          title: Validationwarnings
        evaluations:
          items:
            $ref: '#/components/schemas/Evaluation'
          type: array
          title: Evaluations
      type: object
      required:
      - uuid
      - name
      - bindAllowed
      - referAllowed
      - requiredToSubmit
      title: RiskProfile
    FieldValue:
      properties:
        questionId:
          type: string
          title: Questionid
        value:
          title: Value
      type: object
      required:
      - questionId
      - value
      title: FieldValue
    ImpactingFactor:
      properties:
        attributeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Attributeid
        groupId:
          anyOf:
          - type: string
          - type: 'null'
          title: Groupid
      type: object
      title: ImpactingFactor
    SubmissionResponse:
      properties:
        detail:
          type: string
          title: Detail
          default: submission successful
        quoteSessionId:
          type: string
          title: Quotesessionid
        warnings:
          items:
            $ref: '#/components/schemas/IDPValidationWarning'
          type: array
          title: Warnings
        transactions:
          items:
            $ref: '#/components/schemas/SubmissionTransaction'
          type: array
          title: Transactions
        riskProfiles:
          items:
            $ref: '#/components/schemas/RiskProfile'
          type: array
          title: Riskprofiles
      type: object
      required:
      - quoteSessionId
      - transactions
      - riskProfiles
      title: SubmissionResponse
    RequiredToSubmit:
      properties:
        contractCode:
          type: boolean
          title: Contractcode
        username:
          type: boolean
          title: Username
        password:
          type: boolean
          title: Password
      type: object
      required:
      - contractCode
      - username
      - password
      title: RequiredToSubmit
    IDPValidationError:
      properties:
        groupId:
          anyOf:
          - type: string
          - type: 'null'
          title: Groupid
        questionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Questionid
        errorMsg:
          anyOf:
          - $ref: '#/components/schemas/ErrorMsg'
          - type: 'null'
        value:
          anyOf:
