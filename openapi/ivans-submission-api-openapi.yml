      tags:
      - Submission
      summary: Refer Submission
      description: 'Endpoint to refer quotes through IDP.


        Metadata:

        - clientId: integrator''s account ID, required

        - quoteId: integrator''s quote ID, required

        - callbackUrl: integrator''s callback URL, required


        Market metadata:

        - riskProfile: risk profile UUID, required

        - marketQuoteId: carrier''s quote ID, optional and can be null

        - marketAccountId: carrier''s account ID, optional and can be null

        - contractCodeId: user''s market contract code UUID, optional or required, depending on user configuration

        - credentialId: user''s market credential UUID, optional and can be null

        - referenceIds: carrier''s quote IDs for referral, optional and can be null


        Field values (optional, defaults to empty list):

        - questionId: question UUID, required

        - value: answer value, required


        Repeatable field blocks (optional, defaults to empty list):

        - id: repeatable field block UUID (integrator-generated), required

        - fieldBlockId: repeatable form group UUID, required

        - parentId: parent repeatable field block UUID, required if the repeatable field block is nested, otherwise null

        - fieldValues: list of field values within the repeatable block, required

        - questionId: question UUID, required

