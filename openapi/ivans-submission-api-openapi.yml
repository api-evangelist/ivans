                      evaluations: []
                User does not have access to Market Credential:
                  value:
                    detail: invalid form submission
                    errorDetails:
                    - riskProfile: 46a0248e-d5b1-4127-afb2-f43c0d2c9348
                      lineOfBusiness: BOP
                      validationErrors:
                      - groupId: 85765208-0e5b-49b2-8473-f58a7f174ad6
                        questionId: 8aeff6fc-3366-41b1-a041-b58f2d6c9223
                        errorMsg:
                          detail: 'User does not have access to the credential: 2bd0faa7-2aba-44b4-8671-16e80db47a2df'
                      evaluations: []
                User does not have access to one or more Risk Profiles:
                  value:
                    detail:
                    - 'user does not have permission for the submitted risk profile(s), or the risk profile(s) are no longer available: 2bd0faa7-2aba-44b4-8671-16e80db47a2df'
                User submits a 'Base' Risk Profile:
                  value:
                    detail:
